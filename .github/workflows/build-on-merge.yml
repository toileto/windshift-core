name: Build and Push Docker Image on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  build-and-push:
    name: Build and push image to GHCR
    # Only run when the pull request was merged (not when it was closed
    # without merging), and only for pull requests targeting main.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/toileto/windshift-improved:latest
            ghcr.io/toileto/windshift-improved:${{ github.sha }}
